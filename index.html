<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Mateo Rumac | Frontend & Web Developer</title>

    <!-- Primary SEO -->
    <meta
      name="description"
      content="Mateo Rumac is a frontend developer from Croatia focused on building fast, accessible and thoughtfully designed web experiences using React, Vite and modern web technologies. Portfolio with selected projects, experience and contact. Remote-friendly."
    />
    <meta
      name="keywords"
      content="Mateo Rumac, frontend developer, web developer, React developer, Vite, JavaScript, full stack developer, Croatia, Pula, remote developer, UI developer, UX, web applications, modern frontend"
    />
    <link rel="canonical" href="https://mateorumac.com/" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Mateo Rumac | Frontend & Web Developer"
    />
    <meta
      property="og:description"
      content="Frontend developer focused on fast, accessible and modern web experiences with React and Vite. Explore selected work, experience and get in touch."
    />
    <meta property="og:url" content="https://mateorumac.com/" />
    <meta property="og:site_name" content="Mateo Rumac • Portfolio" />
    <meta property="og:image" content="https://mateorumac.com/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Screenshot of Mateo Rumac portfolio website"
    />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Mateo Rumac | Frontend & Web Developer"
    />
    <meta
      name="twitter:description"
      content="Frontend developer focused on fast, accessible and thoughtfully designed web experiences."
    />
    <meta name="twitter:image" content="https://mateorumac.com/og.jpg" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- Theme Color (for mobile browsers) -->
    <meta name="theme-color" content="#0f1420" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <!-- Apple -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Manifest -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- JSON-LD: Person + Website -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://mateorumac.com#person",
            "name": "Mateo Rumac",
            "url": "https://mateorumac.com/",
            "jobTitle": "Frontend Developer",
            "description": "Frontend developer from Croatia focused on building fast, accessible and thoughtfully designed web experiences using React, Vite and modern web technologies.",
            "email": "mateo.rumac@gmail.com",
            "image": "https://mateorumac.com/og.jpg",
            "sameAs": ["https://www.linkedin.com/in/mateo-rumac-170a0b304/"],
            "knowsAbout": [
              "Frontend development",
              "Web development",
              "Full stack development",
              "React",
              "Vite",
              "JavaScript",
              "UI development",
              "UX",
              "Web accessibility"
            ],
            "knowsLanguage": ["en", "hr"],
            "address": {
              "@type": "PostalAddress",
              "addressCountry": "Croatia",
              "addressLocality": "Pula"
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://mateorumac.com#website",
            "url": "https://mateorumac.com/",
            "name": "Mateo Rumac • Portfolio",
            "publisher": { "@id": "https://mateorumac.com#person" },
            "inLanguage": ["en", "hr"],
            "description": "Portfolio website of frontend developer Mateo Rumac, showcasing selected projects, experience and contact. Remote-friendly."
          }
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
